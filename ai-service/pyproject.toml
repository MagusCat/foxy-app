[project]
name = "foxy-ai-service"
version = "0.1.0"
description = "Microservicio de IA de Foxy: chat, generación de material y contexto documental"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.128.0",
    "uvicorn[standard]==0.38.0",
    "pydantic-settings==2.13.0",
    "openai==2.9.0",
    "httpx==0.28.1",
    "asyncpg==0.30.0",
    "pypdf==6.1.1",
    "python-docx==1.2.0",
    "python-pptx==1.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.2",
    "anyio==4.11.0",
    "ruff==0.14.4",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["prompts.toml"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
